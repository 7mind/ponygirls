# Experimental, explicit opt-in pane only; regular-mode Pi with mouse reporting.
bind-key -T root WheelUpPane if-shell -F '#{&&:#{==:#{@pi-selection-test},1},#{&&:#{mouse_any_flag},#{==:#{alternate_on},0}}}' {
    send-keys -t = -H 1b 5b 4f
    copy-mode -e
    send-keys -X -N 5 scroll-up
} {
    if-shell -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -e }
}
bind-key -T root MouseDrag1Pane if-shell -F '#{&&:#{==:#{@pi-selection-test},1},#{&&:#{mouse_any_flag},#{==:#{alternate_on},0}}}' {
    send-keys -t = -H 1b 5b 4f
    copy-mode -M
} {
    if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -M }
}
