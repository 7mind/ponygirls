[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "manure"
version = "0.2.0"
description = "Human/agent file and directory hosting (artifacts.7mind.io)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
manure = "manure.cli:main"
manure-server = "manure.server:main"
manure-mcp = "manure.mcp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["manure*"]

[tool.setuptools.package-data]
manure = ["web/**/*"]
